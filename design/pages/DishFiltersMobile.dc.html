<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TravelAusNZ — Dish filters, mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#F6F2EA}</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #F6F2EA; font-family: 'Prompt', sans-serif; color: #13213A;">
<dc-import name="Dishes" dark="{{dark}}" open="{{open}}" sheet="{{sheet}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { dark: false, open: '', sheet: true }; }
}
</script>
</body>
</html>
